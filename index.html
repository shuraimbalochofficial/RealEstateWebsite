<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Estate Website</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", Sans-serif;
      }

      .tab-active {
        background-color: #fff;
        color: #111;
      }
    </style>
  </head>
  <body class="bg-neutral-100 text-neutral-900">
    <header class="bg-white">
      <nav class="flex max-w-7xl items-center justify-between py-5 px-5">
        <!-- LOGO  -->
        <a href="#" class="text-xs font-semibold leading-tight tracking-wide">
          DOLMENS <br />
          BUILDERS</a
        >

        <!-- Links -->
        <ul class="hidden sm:flex items-center gap-7 text-sm">
          <li>
            <a href="#properties" class="hover:text-neutral-500">Properties</a>
          </li>
          <li>
            <a href="#search" class="hover:text-neutral-500">Mortgages</a>
            <span
              class="ml-1 bg-black text-white rounded text-[10px] px-1.5 py-0.5"
              >New</span
            >
          </li>
          <li>
            <a href="#about" class="hover:text-neutral-500">About-Company</a>
          </li>
          <li>
            <a href="#agents" class="hover:text-neutral-500">Agents</a>
          </li>
          <li>
            <a href="#footer" class="hover:text-neutral-500">Blogs</a>
          </li>
        </ul>

        <!-- Button -->
        <a
          href="#"
          class="hidden sm:inline-block border rounded border-neutral-300 px-4 py-2 text-sm hover:text-neutral-300 hover:bg-neutral-800 transition-all duration-300"
          >Post A Property</a
        >

        <!-- Hamburger Menu -->
        <button class="sm:hidden text-2xl" aria-label="Open Menu" id="menuBtn">
          ≡
        </button>
      </nav>
    </header>

    <!-- HERO, NOT ZERO -->
    <!-- Tum na jaane kis jahaan me kho gaye-->
    <section class="bg-white pb-10">
      <div>
        <div>
          <div class="">
            <h1
              class="text-4xl font-medium tracking-light leading-tight sm:text-5xl lg:text-6xl"
            >
              Find a place you call HOME
            </h1>
            <a
              href="#search"
              class="mt-8 inline-block rounded bg-black text-white text-sm leading-tight px-5 py-3 hover:bg-neutral-200 border hover:border-neutral-800 hover:text-neutral-800 hover:shadow-lg transition-all duration-300"
              >Book a Call</a
            >
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
