<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Estate Website</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link

    />

    <style>
      body {
        font-family: "Inter", Sans-serif;

        color: #111;
      }

  </head>
